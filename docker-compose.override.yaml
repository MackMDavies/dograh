# Sysevo production overrides.
# - API built from source; Dograh UI replaced with a no-op (Sysevo SPA on Vercel).
# - All services restart automatically on crash or reboot.
# - API memory capped at 1.5GB to prevent OOM-killing nginx.
# - Dedicated worker service runs ARQ background jobs independently of the API.
services:
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: dograh-local/dograh-api:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 512m
    command: ["python", "-m", "arq", "api.tasks.arq.WorkerSettings"]
    volumes:
      - ./api:/app/api:ro
      # THE RECORDING MOUNT. Not optional, and the reason it is spelled out:
      #
      # The api container writes a call's audio and transcript to a temp file
      # and enqueues process_workflow_completion with that PATH. The worker
      # then opens the path. If the two containers do not share /tmp, the
      # worker's os.path.exists() is False, the task logs "Audio temp file not
      # found" at WARNING and returns, and the run's recording_url is never
      # set — every recording and transcript silently discarded.
      #
      # `api` gets this mount from docker-compose.yaml. `worker` exists only in
      # this override, so it inherits nothing and has to declare it. That is
      # exactly what went wrong on 2026-08-05 when this worker service was
      # added: recordings stopped, nothing errored, and the only evidence was a
      # warning line.
      - shared-tmp:/tmp
    environment:
      DATABASE_URL: "postgresql+asyncpg://dograh_app:${DOGRAH_APP_DB_PASSWORD}@postgres:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"
      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?OSS_JWT_SECRET must be set}"
      AUTH_PROVIDER: "${AUTH_PROVIDER:-local}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-oss}"
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://localhost:8000}"
      SYSEVO_MEMORY_PRE_CALL_URL: "${SYSEVO_MEMORY_PRE_CALL_URL:-}"
      SYSEVO_PRE_CALL_CHECK_URL: "${SYSEVO_PRE_CALL_CHECK_URL:-}"
      SYSEVO_POST_CALL_MEMORY_URL: "${SYSEVO_POST_CALL_MEMORY_URL:-}"
      SYSEVO_MEMORY_SECRET: "${SYSEVO_MEMORY_SECRET:-}"
      SYSEVO_WALLET_DEBIT_URL: "${SYSEVO_WALLET_DEBIT_URL:-}"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: dograh-local/dograh-api:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 1500m
    volumes:
      - ./api/.env:/app/api/.env:ro
  ui:
    image: busybox:latest
    command: ["sh", "-c", "httpd -f -p 3010 -h /tmp"]
    pull_policy: if_not_present
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
  coturn:
    restart: unless-stopped
  cloudflared:
    restart: unless-stopped
